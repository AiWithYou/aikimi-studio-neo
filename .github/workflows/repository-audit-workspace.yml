name: Temporary audit workspace

on:
  push:
    branches: [quality/repository-audit-20260907]
    paths: [.github/workflows/repository-audit-workspace.yml]

permissions:
  contents: read

jobs:
  lint-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the repository-pinned lint wheel
        run: python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/lint-tools" ruff==0.15.20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-audit-tools
          retention-days: 1
          path: ${{ runner.temp }}/lint-tools/*.whl
